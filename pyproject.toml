[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-relay"
version = "0.4.0"
description = "A persistent Telegram-source relay with pluggable messaging destinations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
